services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-development}
        NEXT_PUBLIC_TIDECLOAK_AUTH_SERVER_URL: ${NEXT_PUBLIC_TIDECLOAK_AUTH_SERVER_URL:-}
        NEXT_PUBLIC_TIDECLOAK_REALM: ${NEXT_PUBLIC_TIDECLOAK_REALM:-}
        NEXT_PUBLIC_TIDECLOAK_CLIENT_ID: ${NEXT_PUBLIC_TIDECLOAK_CLIENT_ID:-}
        NEXT_PUBLIC_TIDECLOAK_REDIRECT_URI: ${NEXT_PUBLIC_TIDECLOAK_REDIRECT_URI:-http://localhost:3000/auth/redirect}
        NEXT_PUBLIC_TIDECLOAK_ADAPTER_JSON: ${NEXT_PUBLIC_TIDECLOAK_ADAPTER_JSON:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-development}
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-true}
      DEV_AUTH_SUBJECT: local-owner
      DEV_AUTH_NAME: Local Owner
      DEV_AUTH_EMAIL: owner@localhost.test
      DATABASE_URL: postgresql://businessvault:businessvault@postgres:5432/businessvault
      TIDECLOAK_AUTH_SERVER_URL: ${TIDECLOAK_AUTH_SERVER_URL:-}
      TIDECLOAK_REALM: ${TIDECLOAK_REALM:-}
      TIDECLOAK_CLIENT_ID: ${TIDECLOAK_CLIENT_ID:-}
      TIDECLOAK_ADAPTER_JSON: ${TIDECLOAK_ADAPTER_JSON:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: businessvault
      S3_ACCESS_KEY_ID: businessvault
      S3_SECRET_ACCESS_KEY: businessvault-secret
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      VAULT_MAX_CIPHERTEXT_BYTES: "5242880"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://businessvault:businessvault@postgres:5432/businessvault
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: businessvault
      POSTGRES_USER: businessvault
      POSTGRES_PASSWORD: businessvault
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessvault -d businessvault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.4.22
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: businessvault
      MINIO_ROOT_PASSWORD: businessvault-secret
      # Browser uploads/downloads use presigned URLs; only the app (and the Playwright dev server) may call MinIO cross-origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:3200}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set local http://minio:9000 businessvault businessvault-secret && mc mb --ignore-existing local/businessvault && mc anonymous set none local/businessvault && mc admin config set local api cors_allow_origin="http://localhost:3000,http://localhost:3200" && mc admin service restart --json local
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  minio-data:
